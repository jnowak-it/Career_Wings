<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — AI Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <div class="hero-illustration">
            <svg width="120" height="90" viewBox="0 0 120 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="14" y="30" width="70" height="46" rx="2" fill="#f7f4fc" stroke="#ddd4f0" stroke-width="1.5"/>
                <rect x="24" y="20" width="70" height="46" rx="2" fill="#fefdfb" stroke="#ddd4f0" stroke-width="1.5"/>
                <rect x="34" y="10" width="70" height="46" rx="2" fill="#fefdfb" stroke="#a855f7" stroke-width="1.5"/>
                <line x1="44" y1="24" x2="86" y2="24" stroke="#be185d" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="44" y1="34" x2="94" y2="34" stroke="#ddd4f0" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="44" y1="42" x2="78" y2="42" stroke="#ddd4f0" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>Create an account</h1>

        {% if error %}
            <div class="error-box"><p>{{ error }}</p></div>
        {% endif %}

        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="Username" maxlength="80" required>
            <input type="password" name="password" placeholder="Password (min. 8 characters)" required>
            <button type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="/login">Log in</a></p>
    </main>
</body>
</html>
