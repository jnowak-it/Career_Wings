<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <nav class="tabs">
            <button class="tab-button {{ 'active' if active_tab == 'question' else '' }}" data-tab="question">Ask a question</button>
            <button class="tab-button {{ 'active' if active_tab == 'analyze' else '' }}" data-tab="analyze">Analyze data</button>
            <button class="tab-button {{ 'active' if active_tab == 'summarize' else '' }}" data-tab="summarize">Summarize text</button>
        </nav>
        <h1>Ask AI</h1>
        {% if current_user.is_authenticated %}
            <p>Logged in as {{ current_user.username }} | <a href="/logout">Log out</a></p>
        {% else %}
            <p>Not logged in | <a href="/login">Log in</a> | <a href="/register">Register</a></p>
        {% endif %}

        <div class="tab-content {{ 'active' if active_tab == 'question' else '' }}" id="question">
            <form action="/ask" method="POST">
                <textarea
                    name="question"
                    id="question-input"
                    rows="4"
                    placeholder="Enter your question..."
                ></textarea>
                <button type="submit">Send</button>
            </form>
            <div class="answer-box">
                <p>{{ answer }}</p>
            </div>
        </div>

        <div class="tab-content {{ 'active' if active_tab == 'analyze' else '' }}" id="analyze">
            <form action="/analyze" method="POST" enctype="multipart/form-data">
                <input type="file" name="csv_file" id="csv-file-input" accept=".csv">
                <button type="submit">Analyze</button>
            </form>
            <div class="answer-box">
                <p>{{ csv_summary }}</p>
            </div>
        </div>

        <div class="tab-content {{ 'active' if active_tab == 'summarize' else '' }}" id="summarize">
    <form action="/summarize" method="POST">
        <textarea
            name="text_to_summarize"
            id="text-input"
            rows="8"
            placeholder="Paste text here..."
        ></textarea>
        <button type="submit">Summarize</button>
    </form>
    <div class="answer-box">
        <p>{{ text_summary }}</p>
    </div>
</div>
    </main>

    <script>
        const buttons = document.querySelectorAll('.tab-button');
        const contents = document.querySelectorAll('.tab-content');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                buttons.forEach(btn => btn.classList.remove('active'));
                contents.forEach(content => content.classList.remove('active'));

                button.classList.add('active');
                const targetId = button.getAttribute('data-tab');
                document.getElementById(targetId).classList.add('active');
        });
    });
    </script>

</body>
</html>
